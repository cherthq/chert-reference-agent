[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chert-reference-agent"
version = "0.1.0"
description = "Standalone customer-style Chert BYOR reference media agent"
requires-python = ">=3.11,<3.14"
dependencies = ["aiohttp==3.13.3", "livekit==1.1.14", "livekit-api==1.2.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.6"]

[project.scripts]
chert-reference-agent = "chert_reference_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
